[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "qkd-simulation-framework"
version = "0.2.0"
description = "Physically honest Quantum Key Distribution (QKD) simulation and visualization platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "annotated-types==0.7.0",
    "anyio==4.11.0",
    "click==8.3.0",
    "fastapi==0.121.1",
    "httptools==0.7.1",
    "httpx==0.28.1",
    "matplotlib==3.10.7",
    "numpy==2.3.4",
    "pydantic==2.12.4",
    "pydantic_core==2.41.5",
    "PyQt5==5.15.11",
    "pyqtgraph==0.13.7",
    "pytest==9.0.1",
    "python-dotenv==1.2.1",
    "starlette==0.49.3",
    "uvicorn==0.38.0",
    "websockets==15.0.1",
]
